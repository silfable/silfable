appId: ai.silfable.desktop
productName: Silfable
executableName: silfable
asar: true
directories:
  output: release
files:
  - out/**
  - package.json
linux:
  icon: resources/icon.png
  category: Finance
  synopsis: Local-first AI trading runtime with enforceable limits
  syncDesktopName: true
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
win:
  # Valid native ICO avoids runtime image conversion during Windows packaging.
  icon: resources/icon-256.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  verifyUpdateCodeSignature: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Silfable
